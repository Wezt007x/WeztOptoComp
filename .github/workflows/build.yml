name: Build Wezt Opto Comp

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    name: Windows
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCOPY_PLUGIN_AFTER_BUILD=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Collect VST3
        shell: bash
        run: |
          mkdir -p out
          find build -name "*.vst3" -maxdepth 6 -prune -exec cp -R {} out/ \;
          ls -la out
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Make Windows installer
        shell: bash
        run: |
          cat > setup.iss <<'EOF'
          [Setup]
          AppName=Wezt Opto Comp
          AppVersion=0.1.0
          AppPublisher=Wezt
          DefaultDirName={commoncf64}\VST3
          DisableDirPage=yes
          DisableProgramGroupPage=yes
          PrivilegesRequired=admin
          ArchitecturesInstallIn64BitMode=x64compatible
          OutputDir=installer
          OutputBaseFilename=WeztOptoComp-Windows-Setup
          Compression=lzma
          SolidCompression=yes
          [Files]
          Source: "out\Wezt Opto Comp.vst3\*"; DestDir: "{commoncf64}\VST3\Wezt Opto Comp.vst3"; Flags: recursesubdirs ignoreversion
          EOF
          sed -i 's/^          //' setup.iss
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" setup.iss
          ls -la installer
      - uses: actions/upload-artifact@v4
        with:
          name: Wezt-Opto-Comp-Windows-Installer
          path: installer/WeztOptoComp-Windows-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Wezt-Opto-Comp-Windows-VST3
          path: out

  linux:
    runs-on: ubuntu-22.04
    name: Linux
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfreetype6-dev \
            libfontconfig1-dev libgl1-mesa-dev libcurl4-openssl-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCOPY_PLUGIN_AFTER_BUILD=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Collect VST3
        shell: bash
        run: |
          mkdir -p out
          find build -name "*.vst3" -maxdepth 6 -prune -exec cp -R {} out/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: Wezt-Opto-Comp-Linux-VST3
          path: out

  macos:
    runs-on: macos-15
    name: macOS
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCOPY_PLUGIN_AFTER_BUILD=OFF "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Collect VST3
        run: |
          mkdir -p out
          find build -name "*.vst3" -maxdepth 6 -prune -exec cp -R {} out/ \;
      - name: Make Mac installer
        run: |
          pkgbuild --component "out/Wezt Opto Comp.vst3" \
            --install-location "/Library/Audio/Plug-Ins/VST3" \
            --identifier com.wezt.optocomp.vst3 --version 0.1.0 \
            WeztOptoComp-macOS.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: Wezt-Opto-Comp-macOS-Installer
          path: WeztOptoComp-macOS.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: Wezt-Opto-Comp-macOS-VST3
          path: out
