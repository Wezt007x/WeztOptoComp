name: Build Wezt Plugins

on:
  push:
  workflow_dispatch:

env:
  TARGETS: "WeztOptoComp WeztVariMu WeztTubeEQ WeztChorus WeztPhaser WeztVacuum"

jobs:
  windows:
    runs-on: windows-2022
    name: Windows
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCOPY_PLUGIN_AFTER_BUILD=OFF
      - name: Build each plugin
        shell: bash
        run: |
          set +e +o pipefail
          mkdir -p out logs
          OK=0
          for t in $TARGETS; do
            echo "=== Building $t ==="
            cmake --build build --config Release --target ${t}_VST3 --parallel 4 > logs/$t.log 2>&1
            if [ $? -ne 0 ]; then
              MSG=$(grep -i "error" logs/$t.log | head -6 | cut -c1-260 | tr -d '\r' | tr '\n' '|' | sed 's/%/%25/g')
              echo "::error title=$t FAILED::$MSG"
            else
              OK=$((OK+1))
            fi
          done
          find build -name "*.vst3" -maxdepth 6 -prune -exec cp -R {} out/ \;
          ls -la out
          [ $OK -gt 0 ] || exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-build-logs
          path: logs
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Make Windows installer
        shell: bash
        run: |
          cat > setup.iss <<'ISS'
          [Setup]
          AppName=Wezt Plugins
          AppVersion=0.2.0
          AppPublisher=Wezt
          DefaultDirName={commoncf64}\VST3
          DisableDirPage=yes
          DisableProgramGroupPage=yes
          PrivilegesRequired=admin
          ArchitecturesInstallIn64BitMode=x64compatible
          OutputDir=installer
          OutputBaseFilename=WeztPlugins-Windows-Setup
          Compression=lzma
          SolidCompression=yes
          [Files]
          Source: "out\*"; DestDir: "{commoncf64}\VST3"; Flags: recursesubdirs createallsubdirs ignoreversion
          ISS
          sed -i 's/^          //' setup.iss
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" setup.iss
          ls -la installer
      - uses: actions/upload-artifact@v4
        with:
          name: Wezt-Plugins-Windows-Installer
          path: installer/WeztPlugins-Windows-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Wezt-Plugins-Windows-VST3
          path: out

  linux:
    runs-on: ubuntu-22.04
    name: Linux
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfreetype6-dev \
            libfontconfig1-dev libgl1-mesa-dev libcurl4-openssl-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCOPY_PLUGIN_AFTER_BUILD=OFF
      - name: Build each plugin
        shell: bash
        run: |
          set +e +o pipefail
          mkdir -p out logs
          OK=0
          for t in $TARGETS; do
            echo "=== Building $t ==="
            cmake --build build --target ${t}_VST3 --parallel 2 > logs/$t.log 2>&1
            if [ $? -ne 0 ]; then
              MSG=$(grep -i "error" logs/$t.log | head -6 | cut -c1-260 | tr -d '\r' | tr '\n' '|' | sed 's/%/%25/g')
              echo "::error title=$t FAILED::$MSG"
            else
              OK=$((OK+1))
            fi
          done
          find build -name "*.vst3" -maxdepth 6 -prune -exec cp -R {} out/ \;
          ls -la out
          [ $OK -gt 0 ] || exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Linux-build-logs
          path: logs
      - uses: actions/upload-artifact@v4
        with:
          name: Wezt-Plugins-Linux-VST3
          path: out
